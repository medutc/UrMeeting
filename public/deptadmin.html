

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Department Admin Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/UrMeetingLogo.png">
</head>
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("urmeeting-theme")==="dark"?"dark":"light");</script>
<body>
  <div class="topbar">
    <h1 class="topbar-title">
    <img src="images/UrMeetingLogo.png" alt="UrMeeting Logo" class="topbar-logo">
    <span id="pageTitle">Department Admin <span class="role-badge">DEPT ADMIN</span></span>
  </h1>
    <div class="topbar-actions">
      <a class="btn btn-secondary" style="text-decoration:none; margin-right:8px;" href="/messages.html">💬 Messages</a>
      <button class="btn btn-secondary" onclick="logout()">Log Out</button>
    </div>
  </div>

  <div class="container">
    <div class="grid-2">
      <div class="card">
        <h2 id="formTitle">📅 Schedule a Meeting</h2>
        <form id="meetingForm">
          <input type="hidden" id="meetingId">
          <label>Title</label>
          <input type="text" id="title" required>
          <label>Description</label>
          <textarea id="description"></textarea>
          <label>Date</label>
          <input type="date" id="date" required>
          <label>Time</label>
          <input type="time" id="time" required>
          <label>Invite Employees</label>
          <label class="select-all-row" for="selectAllEmployeesCheckbox">
            <input type="checkbox" id="selectAllEmployeesCheckbox"> Invite all department employees
          </label>
          <div class="checkbox-list" id="employeeCheckboxes"></div>
          <div style="margin-top:14px; display:flex; gap:8px;">
            <button class="btn btn-primary" type="submit" id="submitBtn">Create Meeting</button>
            <button class="btn btn-secondary" type="button" id="cancelEditBtn" style="display:none;" onclick="resetForm()">Cancel Edit</button>
          </div>
          <div class="error-msg" id="formError"></div>
          <div class="success-msg" id="formSuccess"></div>
        </form>
      </div>

      <div class="card">
        <h2>👥 Employees in My Department</h2>
        <div id="employeesList"><p class="empty-state">Loading...</p></div>
      </div>
    </div>

    <div class="card">
      <h2>📋 My Department's Meetings</h2>
      <div id="meetingsList"><p class="empty-state">Loading...</p></div>
    </div>

    <div class="card">
      <h2>🗂️ Meeting History <span style="font-weight:normal; font-size:13px; color:var(--text-muted,#888);">(deleted meetings)</span></h2>
      <div id="historyList"><p class="empty-state">Loading...</p></div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
let employees = [];

async function init() {
  initThemeToggle('.topbar-actions');
  const user = await requireAuth('dept_admin');
  if (!user) return;
  initMessagesBadge(user);
  document.getElementById('pageTitle').innerHTML = `${escapeHtml(user.name)}'s Dashboard <span class="role-badge">DEPT ADMIN</span>`;

  await loadEmployees();
  await loadMeetings();
  await loadHistory();
}

async function loadEmployees() {
  const { employees: emps } = await apiGet('/api/employees');
  employees = emps;

  const cbEl = document.getElementById('employeeCheckboxes');
  const selectAllEl = document.getElementById('selectAllEmployeesCheckbox');
  if (employees.length === 0) {
    cbEl.innerHTML = '<p class="empty-state">No employees yet. Ask the Super Admin to create some.</p>';
    selectAllEl.checked = false;
    selectAllEl.disabled = true;
  } else {
    cbEl.innerHTML = employees.map(e => `
      <label><input type="checkbox" value="${e.id}" class="empCheckbox"> ${escapeHtml(e.name)} (${escapeHtml(e.email)})</label>
    `).join('');
    selectAllEl.disabled = false;
    selectAllEl.checked = false;
  }

  // "Invite all" toggles every individual checkbox; if the admin later
  // unchecks any one employee manually, the "select all" box un-ticks itself.
  selectAllEl.onchange = () => {
    document.querySelectorAll('.empCheckbox').forEach(cb => { cb.checked = selectAllEl.checked; });
  };
  cbEl.addEventListener('change', (e) => {
    if (!e.target.classList.contains('empCheckbox')) return;
    const all = document.querySelectorAll('.empCheckbox');
    const allChecked = Array.from(all).every(cb => cb.checked);
    selectAllEl.checked = allChecked && all.length > 0;
  });

  const listEl = document.getElementById('employeesList');
  listEl.innerHTML = employees.length === 0
    ? '<p class="empty-state">No employees in your department yet.</p>'
    : `<table><thead><tr><th>Name</th><th>Email</th></tr></thead><tbody>
        ${employees.map(e => `<tr><td>${escapeHtml(e.name)}</td><td>${escapeHtml(e.email)}</td></tr>`).join('')}
      </tbody></table>`;
}

async function loadMeetings() {
  const { meetings } = await apiGet('/api/meetings/department');
  const el = document.getElementById('meetingsList');
  if (meetings.length === 0) { el.innerHTML = '<p class="empty-state">No meetings scheduled yet.</p>'; return; }

  el.innerHTML = `<table>
    <thead><tr><th>Title</th><th>Date</th><th>Time</th><th>Participants</th><th></th></tr></thead>
    <tbody>
      ${meetings.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time)).map(m => `
        <tr>
          <td>${escapeHtml(m.title)}</td>
          <td>${m.date}</td>
          <td>${m.time}</td>
          <td>${m.participants.map(p => escapeHtml(p.name)).join(', ') || '-'}</td>
          <td class="actions-row">
            <a class="btn btn-primary" style="padding:5px 10px; text-decoration:none;" href="/meeting-room.html?id=${m.id}">Join</a>
            <button class="btn btn-secondary" style="padding:5px 10px;" onclick='editMeeting(${JSON.stringify(m).replace(/'/g,"&#39;")})'>Edit</button>
            <button class="btn btn-danger" style="padding:5px 10px;" onclick="deleteMeeting('${m.id}')">Delete</button>
          </td>
        </tr>
      `).join('')}
    </tbody>
  </table>`;
}

function editMeeting(m) {
  document.getElementById('formTitle').textContent = '✏️ Edit Meeting';
  document.getElementById('submitBtn').textContent = 'Save Changes';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
  document.getElementById('meetingId').value = m.id;
  document.getElementById('title').value = m.title;
  document.getElementById('description').value = m.description;
  document.getElementById('date').value = m.date;
  document.getElementById('time').value = m.time;
  const empCheckboxes = document.querySelectorAll('.empCheckbox');
  empCheckboxes.forEach(cb => {
    cb.checked = m.participantIds.includes(cb.value);
  });
  const selectAllEl = document.getElementById('selectAllEmployeesCheckbox');
  selectAllEl.checked = empCheckboxes.length > 0 && Array.from(empCheckboxes).every(cb => cb.checked);
  window.scrollTo(0, 0);
}

function resetForm() {
  document.getElementById('formTitle').textContent = '📅 Schedule a Meeting';
  document.getElementById('submitBtn').textContent = 'Create Meeting';
  document.getElementById('cancelEditBtn').style.display = 'none';
  document.getElementById('meetingForm').reset();
  document.getElementById('meetingId').value = '';
  document.getElementById('selectAllEmployeesCheckbox').checked = false;
}

async function deleteMeeting(id) {
  if (!confirm('Delete this meeting? Its attendance record will be moved to Meeting History.')) return;
  await apiDelete('/api/meetings/' + id);
  await loadMeetings();
  await loadHistory();
}

async function loadHistory() {
  const { history } = await apiGet('/api/meetings/history');
  const el = document.getElementById('historyList');
  if (history.length === 0) {
    el.innerHTML = '<p class="empty-state">No deleted meetings yet.</p>';
    return;
  }

  el.innerHTML = history.map((h, idx) => {
    const joinedRows = h.joined.length
      ? h.joined.map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.email || '-')}</td><td>${escapeHtml(p.totalFormatted)}</td></tr>`).join('')
      : `<tr><td colspan="3" class="empty-state">Nobody joined this meeting.</td></tr>`;
    const notJoinedRows = h.notJoined.length
      ? h.notJoined.map(p => `<li>${escapeHtml(p.name)} (${escapeHtml(p.email || '-')})</li>`).join('')
      : `<li class="empty-state">Everyone invited joined.</li>`;

    return `
      <div class="history-entry" style="border:1px solid var(--border-color,#333); border-radius:8px; padding:14px; margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div>
            <strong>${escapeHtml(h.title)}</strong>
            <div style="font-size:13px; color:var(--text-muted,#888);">Scheduled: ${h.date} ${h.time} &middot; Deleted: ${new Date(h.deletedAt).toLocaleString()}</div>
          </div>
          <div style="font-size:13px;"><strong>Actual duration:</strong> ${escapeHtml(h.durationFormatted)}</div>
        </div>
        ${h.description ? `<p style="margin:8px 0; font-size:14px;">${escapeHtml(h.description)}</p>` : ''}
        <div class="grid-2" style="margin-top:10px; gap:16px;">
          <div>
            <h4 style="margin:0 0 6px;">✅ Joined (${h.joined.length})</h4>
            <table><thead><tr><th>Name</th><th>Email</th><th>Time in meeting</th></tr></thead>
              <tbody>${joinedRows}</tbody>
            </table>
          </div>
          <div>
            <h4 style="margin:0 0 6px;">❌ Invited but did not join (${h.notJoined.length})</h4>
            <ul style="margin:0; padding-left:18px;">${notJoinedRows}</ul>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('meetingForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formError = document.getElementById('formError');
  const formSuccess = document.getElementById('formSuccess');
  formError.textContent = ''; formSuccess.textContent = '';

  const participantIds = Array.from(document.querySelectorAll('.empCheckbox:checked')).map(cb => cb.value);
  const payload = {
    title: document.getElementById('title').value,
    description: document.getElementById('description').value,
    date: document.getElementById('date').value,
    time: document.getElementById('time').value,
    participantIds
  };

  try {
    const id = document.getElementById('meetingId').value;
    if (id) {
      await apiPut('/api/meetings/' + id, payload);
      formSuccess.textContent = 'Meeting updated!';
    } else {
      await apiPost('/api/meetings', payload);
      formSuccess.textContent = 'Meeting created!';
    }
    resetForm();
    await loadMeetings();
  } catch (err) {
    formError.textContent = err.message;
  }
});

init();
</script>
</body>
</html>
